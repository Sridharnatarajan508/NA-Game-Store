<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - NA Game Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="logo"><a href="home.html" style="color: cyan; text-decoration: none;">GameZone</a></h1>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="home.html">Games</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signin.html">Sign In</a></li>
                <li><a href="home.html" class="cart-btn">Cart (0)</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-container">
        <form class="auth-form" action="home.html">
            <h2>Login to Your Account</h2>
            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="auth-submit-btn">Login</button>
            <p class="auth-link">Don't have an account? <a href="signin.html">Sign In here</a></p>
        </form>
    </div>
</body>

</html>
